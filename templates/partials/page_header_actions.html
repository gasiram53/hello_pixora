<div class="page-header-actions" data-page-header-actions>
  <a class="page-header-action page-header-notifications" href="{{ url_for('notifications.index') }}"
     aria-label="Notifications{% if unread_notifications %}, {{ unread_notifications }} unread{% endif %}" title="Notifications">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
    {% if unread_notifications %}<span class="page-header-badge" aria-hidden="true">{{ unread_notifications if unread_notifications < 100 else "99+" }}</span>{% endif %}
  </a>
  <button class="page-header-action theme-toggle page-header-theme-toggle" type="button" data-theme-toggle
          aria-pressed="false" aria-label="Switch to dark mode" title="Switch theme">
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.6 8.6 0 1 0 20.2 15.4Z"/></svg>
    <span class="sr-only" data-theme-label>Dark mode</span>
  </button>
</div>
