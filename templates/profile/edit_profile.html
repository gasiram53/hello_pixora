{% extends "base.html" %}
{% block title %}Edit profile · PIXORA{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name<input name="full_name" maxlength="80" value="{{ profile_user.full_name }}" required></label>
    <label>Bio<textarea name="bio" maxlength="300" rows="4">{{ profile_user.bio }}</textarea></label>
    <label>Website<input type="url" name="website" maxlength="255" value="{{ profile_user.website or '' }}" placeholder="https://example.com"></label>
    <label>Change profile picture<input type="file" name="avatar" accept="image/png,image/jpeg,image/gif,image/webp"></label>
    <button class="button" type="submit">Save changes</button>
  </form>
</section>
{% endblock %}
