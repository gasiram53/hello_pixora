{% extends "base.html" %}
{% block title %}Create post · PIXORA{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Share a post</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Photo or video<input type="file" name="media" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/quicktime" required data-post-media>
      <small>Images and MP4, MOV, or WEBM videos · up to 20 MB</small>
    </label>
    <figure class="post-upload-preview" data-post-preview hidden></figure>
    <label>Caption<textarea name="caption" maxlength="2200" rows="5"></textarea></label>
    <button class="button" type="submit">Publish post</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/post.js') }}" defer></script>
{% endblock %}
